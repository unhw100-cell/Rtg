[workspace]
resolver = "2"
members = [
  "crates/rustgram-common",
  "crates/rustgram-crypto",
  "crates/rustgram-auth",
  "crates/rustgram-profile",
  "crates/rustgram-contacts",
  "crates/rustgram-messaging",
  "crates/rustgram-chat",
  "crates/rustgram-groups",
  "crates/rustgram-search",
  "crates/rustgram-storage",
  "crates/rustgram-sync",
  "crates/rustgram-media",
  "crates/rustgram-ai",
  "crates/rustgram-core",
  "crates/rust-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
